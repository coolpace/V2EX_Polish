[build]
  # 部署 apps/website。构建命令在仓库根目录执行，因此用 --filter 指定 workspace 包，
  # publish 也需要写成相对于仓库根目录的路径。
  # 注意：Netlify UI 中的 base / package directory 必须留空，否则读不到本文件。
  command = "pnpm --filter v2ex-polish-website build"
  publish = "apps/website/.next"

  # 注意：ignore 的退出码语义与直觉相反——返回 0 表示「跳过构建」，非 0 才继续构建。
  # 这里直接借用 git diff 的退出码（有改动为 1、无改动为 0）驱动判断：
  # 仅当 apps/website 或会影响其构建结果的根级文件变动时才构建，
  # extension / docs / tests 等提交不再消耗 Netlify 构建时长。
  # CACHED_COMMIT_REF 与 COMMIT_REF 相同时（首次部署、清缓存重建）diff 恒为空会误跳过，故强制构建。
  ignore = 'if [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ]; then exit 1; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- apps/website pnpm-lock.yaml pnpm-workspace.yaml package.json netlify.toml || exit 1'

[build.environment]
  NODE_VERSION = "22"

# 支持 SSR、API Routes（/api/donation、/api/qrcode 等）
[[plugins]]
  package = "@netlify/plugin-nextjs"
